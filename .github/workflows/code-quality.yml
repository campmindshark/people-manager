name: Code Quality and Styles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-style:
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend
          - backend

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # pnpm is needed because `lint`/`style` scripts use `pnpx` to fetch the
      # pinned ESLint 8.57.0 and Prettier 3.9.6 versions. Neither tool is
      # intentionally installed globally.
      # Pinned to v9 because (a) `pnpx` was deprecated and removed from
      # later versions, and (b) leaving it unpinned silently drifts on
      # every CI run.
      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Style Check
        run: yarn workspace ${{ matrix.project }} style

      - name: Lint
        run: yarn workspace ${{ matrix.project }} lint

      - name: Build
        run: yarn workspace ${{ matrix.project }} build

  postgres-integration:
    name: PostgreSQL migration integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: people_manager_chore_teardown_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d people_manager_chore_teardown_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CHORE_TEARDOWN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/people_manager_chore_teardown_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run chore teardown migration tests
        run: yarn test:migration:chore-teardown

  docker-integration:
    name: Docker integration smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Docker integration smoke test
        run: yarn test:integration:docker
